name: Temporary Equity Perp Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/equity_perp_tmp/collector.py"
      - ".github/workflows/tmp-equity-perp-snapshot.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect and package exchange universes
        run: python3 artifacts/equity_perp_tmp/collector.py
      - name: Commit snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/equity_perp_tmp/output artifacts/equity_perp_tmp/equity_perps_snapshot.zip
          git commit -m "data: temporary equity perp snapshot" || exit 0
          git push
